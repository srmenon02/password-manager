name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gates the react-hooks and unused-disable rules. The repo reached zero errors and
      # zero warnings; --max-warnings 0 in the lint script keeps it there.
      - name: Lint
        run: npm run lint --workspace=frontend

      - name: Build
        run: npm run build --workspace=frontend

      - name: Test
        run: npx vitest run
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      # Backend tests build a fresh SQLite database per test, so no Postgres or Redis
      # service is needed here.
      - name: Test
        run: python -m pytest -q
        working-directory: backend
