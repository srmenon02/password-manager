name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.10'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: npm ci
      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      # Both workspaces lint with --max-warnings 0, so any warning fails the job.
      - name: ESLint (frontend)
        run: npm run lint --workspace=frontend
      - name: ESLint (shared)
        run: npm run lint --workspace=shared
      # Config in backend/ruff.toml; T20 is enabled to keep debug prints out of the
      # SRP and vault paths, where they have leaked session keys to stdout before.
      - name: Ruff (backend)
        run: ruff check app tests
        working-directory: backend

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: npm ci
      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Frontend tests
        run: npx vitest run --coverage 2>&1 | tee "$RUNNER_TEMP/vitest.txt"
        working-directory: frontend

      # Backend tests build a fresh SQLite database per test, so no Postgres or Redis
      # service is needed here.
      - name: Backend tests
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=70 2>&1 | tee "$RUNNER_TEMP/pytest.txt"
        working-directory: backend

      - name: Publish results to summary
        if: always()
        run: |
          {
            echo '## Frontend (vitest + v8 coverage)'
            echo '```'
            cat "$RUNNER_TEMP/vitest.txt" 2>/dev/null || echo 'no output'
            echo '```'
            echo '## Backend (pytest + coverage, gate 70%)'
            echo '```'
            cat "$RUNNER_TEMP/pytest.txt" 2>/dev/null || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: npm ci
      # `tsc && vite build` — typecheck failures fail the build.
      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      # FastAPI has no build artifact, so the equivalent check is that the app and every
      # router import cleanly. Values are throwaway: settings are required at import time
      # but never used here, and no real secret is involved.
      - name: Import-check backend
        run: python -c "import app.main"
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/build-check.db
          JWT_SECRET: ci-build-check-not-a-real-secret

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # Rehearses the fly.io release sequence against a real Postgres. Everything below
  # is invisible to the other jobs: they build no image, and backend tests run on
  # SQLite, so migrations and the Dockerfile previously met their real dialect and
  # runtime for the first time in production.
  release-rehearsal:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cipher
          POSTGRES_PASSWORD: cipher
          POSTGRES_DB: cipher
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: postgresql://cipher:cipher@localhost:5432/cipher
      JWT_SECRET: ci-release-rehearsal-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t cipher-api:ci backend

      # The image drops to a non-root user; a regression here is only visible
      # by inspecting the built image.
      - name: Image must not run as root
        run: |
          uid="$(docker run --rm cipher-api:ci id -u)"
          echo "container uid: $uid"
          if [ "$uid" = "0" ]; then echo "::error::image runs as root"; exit 1; fi

      # Byte-for-byte the release_command in fly.toml.
      - name: Migrate (fly.toml release_command)
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$DB_URL" -e JWT_SECRET="$JWT_SECRET" \
            cipher-api:ci alembic upgrade head

      # Re-running must be a no-op; fly re-runs it on every deploy.
      - name: Migrations are idempotent
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$DB_URL" -e JWT_SECRET="$JWT_SECRET" \
            cipher-api:ci alembic upgrade head

      # Boots with ENVIRONMENT=production so the production CORS path is the one
      # exercised. Import of app.main also runs ensure_schema_compatibility()
      # against Postgres, which no other job does.
      - name: Boot API and smoke-check /health
        run: |
          docker run -d --name cipher-ci --network host \
            -e DATABASE_URL="$DB_URL" -e JWT_SECRET="$JWT_SECRET" \
            -e ENVIRONMENT=production \
            -e CORS_ORIGINS=https://cipher-vault.app \
            cipher-api:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health -o /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "::error::API never became healthy"
          exit 1

      - name: Container logs
        if: always()
        run: docker logs cipher-ci 2>&1 | tail -50 || true
