<style>
        body { background-color: theme('colors.paper'); color: theme('colors.ink'); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

            background-color: theme('colors.mint');
            border: 1px solid theme('colors.ink');
            border-radius: 0;
            transition: background-color 0.2s;
        }
        .btn-primary:hover { background-color: theme('colors.primary'); color: theme('colors.on-primary'); }
        
        .btn-secondary {
            background-color: transparent;
            border: 1px solid theme('colors.ink');
            border-radius: 0;
            transition: color 0.2s, border-color 0.2s, background-color 0.2s;
        }
        .btn-secondary:hover { background-color: theme('colors.ink'); color: theme('colors.paper'); }

        .input-line {
            border: none;
            border-bottom: 2px solid theme('colors.ink');
            background: transparent;
            border-radius: 0;
        }
        .input-line:focus { outline: none; border-bottom-color: theme('colors.mint'); box-shadow: none; }

<body class="min-h-screen flex flex-col font-body-md text-body-md">
<!-- TopNavBar -->
<header class="w-full h-16 bg-paper dark:bg-surface flex justify-between items-center px-gutter w-full max-w-full z-50 sticky top-0 border-b border-surface-dim">

<div class="flex gap-4 items-center">
<button class="btn-secondary px-4 py-2 font-body-md hidden md:block">Log Out</button>
<button class="btn-primary px-4 py-2 font-body-md font-bold text-ink">Create Login</button>
</div>
</header>

</div>
<div class="w-full md:w-1/3 flex items-center relative">

</div>
</div>
<!-- Asymmetric Content Grid -->
<div class="grid grid-cols-1 md:grid-cols-12 gap-8 relative">
<!-- Playful Element (Left Col) -->
<!-- Vault List (Main Col) -->
<div class="col-span-1 md:col-span-12">
<div class="flex flex-col gap-6">
<!-- Item 01 -->
<div class="flex items-center justify-between border border-surface-dim bg-surface-container-lowest p-6 rounded-lg group cursor-pointer relative overflow-hidden shadow-sm hover:border-mint transition-colors">

<span class="font-body-lg text-body-lg text-on-surface-variant font-bold">01</span>
<div>
<h3 class="font-headline-md text-headline-md mb-1 text-ink group-hover:text-primary transition-colors">Bank of America</h3>
<p class="font-body-md text-body-md text-on-surface">user@example.com</p>
</div>
</div>
<div class="flex items-center gap-4 z-10 relative">

<button class="w-10 h-10 border border-ink flex items-center justify-center hover:bg-mint hover:border-mint transition-colors bg-white">
<span class="material-symbols-outlined text-ink">content_copy</span>
</button>
</div>
</div>
<!-- Item 02 -->

</div>
